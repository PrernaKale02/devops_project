spring.application.name=child-education-sponsorship
server.port=8001

# H2 is used for the initial local development setup.
# MySQL will be used as the deployment database in the later DevOps stages.
spring.datasource.url=jdbc:h2:mem:sponsorshipdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
