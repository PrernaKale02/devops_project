<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            Sponsorship Record
        </title>
        <link rel="stylesheet" th:href="@{/css/portal.css}">
    </head>
    <body>
        <div class="shell">
            <aside class="sidebar">
                <a class="brand" href="/sponsorships/dashboard">
                    <span class="brand-mark">
                        P
                    </span>
                    <span>
                        Prerna
                        <small>
                            Education programs
                        </small>
                    </span>
                </a>
                <div class="nav-label">
                    WORKSPACE
                </div>
                <nav>
                    <a class="nav-link" href="/sponsorships/dashboard">
                        Dashboard
                    </a>
                    <a class="nav-link" href="/sponsorships/children">
                        Children
                    </a>
                    <a class="nav-link" href="/sponsorships/sponsors">
                        Sponsors
                    </a>
                    <a class="nav-link active" href="/sponsorships">
                        Sponsorships
                    </a>
                </nav>
            </aside>
            <main class="main">
                <header class="topbar">
                    <span class="crumb">
                        <a href="/sponsorships">
                            Sponsorships
                        </a>
                        / Record
                    </span>
                    <span class="user">
                        <span class="avatar">
                            P
                        </span>
                        Program team
                    </span>
                </header>
                <section class="content">
                    <div class="page-head">
                        <div>
                            <div class="eyebrow">
                                Program records
                            </div>
                            <h1>
                                Sponsorship record
                            </h1>
                            <p class="subhead">
                                Add or update a child's education support details.
                            </p>
                        </div>
                    </div>
                    <section class="panel">
                        <form th:action="@{/sponsorships/save}" th:object="${sponsorship}" method="post">
                            <input type="hidden" th:field="*{id}">
                            <div class="form-grid">
                                <div class="field">
                                    <label for="childId">
                                        Child ID
                                    </label>
                                    <input id="childId" type="text" th:field="*{childId}" required>
                                </div>
                                <div class="field">
                                    <label for="childName">
                                        Child name
                                    </label>
                                    <input id="childName" type="text" th:field="*{childName}" required>
                                </div>
                                <div class="field">
                                    <label for="age">
                                        Age
                                    </label>
                                    <input id="age" type="number" min="1" max="25" th:field="*{age}" required>
                                </div>
                                <div class="field">
                                    <label for="gender">
                                        Gender
                                    </label>
                                    <select id="gender" th:field="*{gender}">
                                        <option value="">
                                            Select
                                        </option>
                                        <option value="Male">
                                            Male
                                        </option>
                                        <option value="Female">
                                            Female
                                        </option>
                                        <option value="Other">
                                            Other
                                        </option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label for="educationLevel">
                                        Education level
                                    </label>
                                    <input id="educationLevel" type="text" th:field="*{educationLevel}" required>
                                </div>
                                <div class="field">
                                    <label for="school">
                                        School
                                    </label>
                                    <input id="school" type="text" th:field="*{school}" required>
                                </div>
                                <div class="field">
                                    <label for="sponsorName">
                                        Sponsor name
                                    </label>
                                    <input id="sponsorName" type="text" th:field="*{sponsorName}" required>
                                </div>
                                <div class="field">
                                    <label for="sponsorshipAmount">
                                        Sponsorship amount
                                    </label>
                                    <input id="sponsorshipAmount" type="number" step="0.01" min="0" th:field="*{sponsorshipAmount}" required>
                                </div>
                                <div class="field">
                                    <label for="startDate">
                                        Start date
                                    </label>
                                    <input id="startDate" type="date" th:field="*{startDate}" required>
                                </div>
                                <div class="field">
                                    <label for="status">
                                        Status
                                    </label>
                                    <select id="status" th:field="*{status}">
                                        <option value="PENDING">
                                            Pending
                                        </option>
                                        <option value="ACTIVE">
                                            Active
                                        </option>
                                        <option value="COMPLETED">
                                            Completed
                                        </option>
                                        <option value="CANCELLED">
                                            Cancelled
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn" type="submit">
                                    Save sponsorship
                                </button>
                                <a class="btn secondary" href="/sponsorships">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </section>
                </section>
            </main>
        </div>
    </body>
</html>
