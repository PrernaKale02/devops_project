<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<title>Sponsorship Form</title>

		<style>
			body {
				font-family: Arial, sans-serif;
				background: #f5f7fa;
				padding: 40px;
			}

			.container {
				max-width: 700px;
				margin: auto;
				background: white;
				padding: 30px;
				border-radius: 10px;
			}

			.field {
				margin-bottom: 15px;
			}

			label {
				display: block;
				margin-bottom: 5px;
				font-weight: bold;
			}

			input,
			select {
				width: 100%;
				padding: 10px;
				box-sizing: border-box;
			}

			button {
				margin-top: 15px;
				padding: 12px 20px;
				background: #2563eb;
				color: white;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}

			a {
				margin-left: 10px;
			}
		</style>
	</head>

	<body>
		<div class="container">
			<h1>Sponsorship Record</h1>

			<form
				th:action="@{/sponsorships/save}"
				th:object="${sponsorship}"
				method="post"
			>
				<input type="hidden" th:field="*{id}" />
				<div class="field">
					<label>Child ID</label>
					<input type="text" th:field="*{childId}" required />
				</div>

				<div class="field">
					<label>Child Name</label>
					<input type="text" th:field="*{childName}" required />
				</div>

				<div class="field">
					<label>Age</label>
					<input type="number" th:field="*{age}" required />
				</div>

				<div class="field">
					<label>Gender</label>
					<select th:field="*{gender}">
						<option value="">Select</option>
						<option value="Male">Male</option>
						<option value="Female">Female</option>
						<option value="Other">Other</option>
					</select>
				</div>

				<div class="field">
					<label>Education Level</label>
					<input type="text" th:field="*{educationLevel}" required />
				</div>

				<div class="field">
					<label>School</label>
					<input type="text" th:field="*{school}" required />
				</div>

				<div class="field">
					<label>Sponsor Name</label>
					<input type="text" th:field="*{sponsorName}" required />
				</div>

				<div class="field">
					<label>Sponsorship Amount</label>
					<input
						type="number"
						step="0.01"
						th:field="*{sponsorshipAmount}"
						required
					/>
				</div>

				<div class="field">
					<label>Start Date</label>
					<input type="date" th:field="*{startDate}" required />
				</div>

				<div class="field">
					<label>Status</label>
					<select th:field="*{status}">
						<option value="PENDING">Pending</option>
						<option value="ACTIVE">Active</option>
						<option value="COMPLETED">Completed</option>
						<option value="CANCELLED">Cancelled</option>
					</select>
				</div>

				<button type="submit">Save Sponsorship</button>

				<a href="/sponsorships">Cancel</a>
			</form>
		</div>
	</body>
</html>
