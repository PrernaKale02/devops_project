<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Education Sponsorship System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
        .container { max-width: 900px; margin: 60px auto; padding: 30px; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
        h1 { margin-top: 0; }
        .status { display: inline-block; padding: 8px 12px; border-radius: 20px; background: #e8f5e9; }
        ul { line-height: 1.9; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Child Education Sponsorship System</h1>
        <p class="status">Local development setup is running</p>
        <h3>Project MVP</h3>
        <ul>
            <li>Role-based user access</li>
            <li>Sponsorship record management</li>
            <li>Status workflow</li>
            <li>Summary dashboard</li>
        </ul>
        <p><strong>DevOps stack:</strong> GitHub, Jenkins, Maven, Selenium, Docker and Ansible</p>
    </div>
</div>
</body>
</html>
